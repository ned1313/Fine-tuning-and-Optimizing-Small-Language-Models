[project]
name = "basic-sft-example"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bitsandbytes>=0.50.1",
    "datasets>=5.0.1",
    "dotenv>=0.9.9",
    "gguf>=0.19.0",
    "huggingface-hub>=1.27.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "openai>=3.0.0",
    "peft>=0.20.0",
    "scipy>=1.15.3",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "trl>=1.9.2",
    "typing>=3.10.0.0",
]

[project.optional-dependencies]
gguf = [
    "llama-cpp-python>=0.3.0",
]


[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
